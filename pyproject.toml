[project]
name = "mimoe-cgm-agent"
version = "0.1.0"
description = "A small CGM wellness agent running on mimOE's local OpenAI-compatible inference endpoint"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "logfire[fastapi]>=5.1.1",
    "openai>=3.28.0",
    "openai-agents[viz]>=0.23.1",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real mimOE endpoint (skips when unreachable)"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mimoe_agent"]
